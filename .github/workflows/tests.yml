name: EIOS Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: "EiosCi_${{ github.run_id }}#SqlServer!"
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'EiosCi_${{ github.run_id }}#SqlServer!' -C -Q 'SELECT 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project and test dependencies
        run: |
          python -m pip install --upgrade pip
          # Match local installations containing a company data directory.
          python -c "from pathlib import Path; p = Path('Data'); p.mkdir(exist_ok=True); (p / 'packaging_probe.txt').write_text('company data, not a Python package')"
          python -m pip install -e ".[test]"
      - name: Run Python tests
        run: python -m pytest -q
      - name: Validate SQL Server C0, Decision Versioning, and Parameter Configuration schemas
        env:
          MSSQL_SA_PASSWORD: "EiosCi_${{ github.run_id }}#SqlServer!"
        run: |
          set -euo pipefail
          SQL_CONTAINER="$(docker ps -q --filter 'ancestor=mcr.microsoft.com/mssql/server:2022-latest' | head -n 1)"
          test -n "$SQL_CONTAINER"

          docker exec -i "$SQL_CONTAINER" /opt/mssql-tools18/bin/sqlcmd \
            -S localhost -U sa -P "$MSSQL_SA_PASSWORD" -C -d master \
            -Q "IF DB_ID(N'eios_ci') IS NULL CREATE DATABASE eios_ci;"

          docker cp 06_SQL/001_C0_Schema.sql "$SQL_CONTAINER:/tmp/001_C0_Schema.sql"
          docker cp 06_SQL/002_Decision_Versioning_Schema.sql "$SQL_CONTAINER:/tmp/002_Decision_Versioning_Schema.sql"
          docker cp 06_SQL/003_Centro_Parametrizacion_Schema.sql "$SQL_CONTAINER:/tmp/003_Centro_Parametrizacion_Schema.sql"
          docker cp .github/sql/validate_c0_schema.sql "$SQL_CONTAINER:/tmp/validate_c0_schema.sql"
          docker cp .github/sql/validate_decision_versioning_schema.sql "$SQL_CONTAINER:/tmp/validate_decision_versioning_schema.sql"
          docker cp .github/sql/validate_parameter_configuration_schema.sql "$SQL_CONTAINER:/tmp/validate_parameter_configuration_schema.sql"

          docker exec -i "$SQL_CONTAINER" /opt/mssql-tools18/bin/sqlcmd \
            -S localhost -U sa -P "$MSSQL_SA_PASSWORD" -C -d eios_ci \
            -i /tmp/001_C0_Schema.sql -b

          docker exec -i "$SQL_CONTAINER" /opt/mssql-tools18/bin/sqlcmd \
            -S localhost -U sa -P "$MSSQL_SA_PASSWORD" -C -d eios_ci \
            -i /tmp/validate_c0_schema.sql -b

          docker exec -i "$SQL_CONTAINER" /opt/mssql-tools18/bin/sqlcmd \
            -S localhost -U sa -P "$MSSQL_SA_PASSWORD" -C -d eios_ci \
            -i /tmp/002_Decision_Versioning_Schema.sql -b

          docker exec -i "$SQL_CONTAINER" /opt/mssql-tools18/bin/sqlcmd \
            -S localhost -U sa -P "$MSSQL_SA_PASSWORD" -C -d eios_ci \
            -i /tmp/validate_decision_versioning_schema.sql -b

          docker exec -i "$SQL_CONTAINER" /opt/mssql-tools18/bin/sqlcmd \
            -S localhost -U sa -P "$MSSQL_SA_PASSWORD" -C -d eios_ci \
            -i /tmp/003_Centro_Parametrizacion_Schema.sql -b

          docker exec -i "$SQL_CONTAINER" /opt/mssql-tools18/bin/sqlcmd \
            -S localhost -U sa -P "$MSSQL_SA_PASSWORD" -C -d eios_ci \
            -i /tmp/validate_parameter_configuration_schema.sql -b

      - name: Build audited standalone EIOS kernel distribution
        run: |
          python -m pip install "setuptools>=64" "wheel>=0.42"
          python tools/build_eios_kernel_distribution.py --output dist/kernel
      - name: Verify independent kernel installation in fresh venv
        run: python tools/verify_eios_kernel_distribution.py --wheel-dir dist/kernel

      - name: F4.4 test two independent consumers on one exact kernel wheel
        run: python tools/verify_f4_4_two_consumers.py --wheel-dir dist/kernel

      - name: F5.5 build single canonical procurement contracts distribution
        run: python tools/build_eios_contracts_distribution.py --output dist/contracts

      - name: F5.3 build canonical optional TCO procurement distribution
        run: python tools/build_eios_tco_distribution.py --output dist/tco
      - name: F5.3 verify TCO alone and jointly with the neutral kernel
        run: python tools/verify_f5_3_optional_tco.py --tco-dir dist/tco --kernel-dir dist/kernel --contracts-dir dist/contracts

      - name: F5.4 build audited optional procurement PRICE distribution
        run: python tools/build_eios_price_distribution.py --output dist/price
      - name: F5.4 verify standalone PRICE, kernel coexistence and TCO conflict gate
        run: python tools/verify_f5_4_optional_price.py --price-dir dist/price --kernel-dir dist/kernel --tco-dir dist/tco --contracts-dir dist/contracts

      - name: F5.5 co-install four canonical wheels and execute real PRICE/TCO
        run: python tools/verify_f5_5_shared_contracts.py --contracts-dir dist/contracts --kernel-dir dist/kernel --price-dir dist/price --tco-dir dist/tco

      - name: F5.6 build neutral project input-contracts wheel
        run: python tools/build_eios_input_contracts_distribution.py --output dist/inputs
      - name: F5.6 verify two isolated projects with one neutral input contract
        run: python tools/verify_f5_6_two_domains.py --kernel-dir dist/kernel --inputs-dir dist/inputs --contracts-dir dist/contracts --price-dir dist/price --tco-dir dist/tco

      - name: F5.7 build audited optional capability catalog wheel
        run: python tools/build_eios_capability_catalog_distribution.py --output dist/catalog
      - name: F5.7 verify explicit release catalog in isolated Sales and real Procurement
        run: python tools/verify_f5_7_capability_catalog.py --kernel-dir dist/kernel --inputs-dir dist/inputs --catalog-dir dist/catalog --contracts-dir dist/contracts --price-dir dist/price --tco-dir dist/tco

      - name: F5.8 build independently audited catalog governance wheel
        run: python tools/build_eios_catalog_governance_distribution.py --output dist/governance
      - name: F5.8 verify externally authorized configuration and two isolated consumers
        run: python tools/verify_f5_8_governance_two_domains.py --kernel-dir dist/kernel --inputs-dir dist/inputs --catalog-dir dist/catalog --governance-dir dist/governance --contracts-dir dist/contracts --price-dir dist/price --tco-dir dist/tco

      - name: F5.9 audit external maintenance consumer and prove third-domain portability
        run: python tools/verify_f5_9_third_domain.py --kernel-dir dist/kernel --inputs-dir dist/inputs --catalog-dir dist/catalog --governance-dir dist/governance

      - name: F5.10 build hash-locked neutral onboarding ZIP for current CI platform
        run: python tools/build_f5_10_release_kit.py --kernel-dir dist/kernel --inputs-dir dist/inputs --catalog-dir dist/catalog --governance-dir dist/governance --output dist/release-kit
      - name: F5.10 certify extracted ZIP twice with fully offline installs and tamper probes
        run: python tools/verify_f5_10_release_kit.py --kit-dir dist/release-kit
      - name: F6.2 independently install external company adapter and test two tenants
        run: python tools/verify_f6_2_external_company_adapter.py --kit-dir dist/release-kit
      - name: F6.3 independently install synthetic documentary boundary and audit two tenants
        run: python tools/verify_f6_3_documentary_boundary.py --kit-dir dist/release-kit
      - name: F6.4 certify synthetic custody on Linux
        run: python tools/verify_f6_4_custody_portability.py --kit-dir dist/release-kit
      - name: F6.5–F6.10 certify onboarding through retry safety on Linux
        run: python tools/verify_f6_5_provider_onboarding.py --kit-dir dist/release-kit
      - name: F5.10 retain independently installable onboarding kit
        uses: actions/upload-artifact@v4
        with:
          name: EIOS-F5-10-Neutral-Onboarding-Kit
          path: dist/release-kit/EIOS_F5_10_Neutral_Onboarding_Kit.zip
          if-no-files-found: error
          retention-days: 14


  f6_1_windows_portability:
    name: F6.1 Windows offline certification (Python 3.12)
    needs: test
    runs-on: windows-latest
    permissions:
      contents: read
    env:
      PYTHONUTF8: "1"
    steps:
      - name: Checkout exact tested revision
        uses: actions/checkout@v4
      - name: Set up Windows Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build four canonical neutral wheels on Windows
        shell: pwsh
        run: |
          python -m pip install "setuptools>=64" "wheel>=0.42"
          python tools/build_eios_kernel_distribution.py --output dist/kernel
          python tools/build_eios_input_contracts_distribution.py --output dist/inputs
          python tools/build_eios_capability_catalog_distribution.py --output dist/catalog
          python tools/build_eios_catalog_governance_distribution.py --output dist/governance
      - name: Build separate hash-locked Windows onboarding ZIP
        shell: pwsh
        run: |
          python tools/build_f5_10_release_kit.py --kernel-dir dist/kernel --inputs-dir dist/inputs --catalog-dir dist/catalog --governance-dir dist/governance --output dist/release-kit
      - name: Certify two independent offline Windows deployments and corruption rejections
        shell: pwsh
        run: python tools/verify_f5_10_release_kit.py --kit-dir dist/release-kit
      - name: Verify Windows and Python identity in packaged manifest
        shell: pwsh
        run: |
          python -c "import json,platform; from pathlib import Path; from zipfile import ZipFile; z=ZipFile(Path('dist/release-kit/EIOS_F5_10_Neutral_Onboarding_Kit.zip')); m=json.loads(z.read('manifest.json')); assert m['platform']=='win32' and m['python_minor']=='3.12' and m['machine']==platform.machine(); assert m['purpose']=='SYNTHETIC_TECHNICAL_ONBOARDING_ONLY'; print('Windows 3.12 only; synthetic; manifest verified')"
      - name: F6.2 certify external company adapter on Windows with two isolated tenants
        shell: pwsh
        run: python tools/verify_f6_2_external_company_adapter.py --kit-dir dist/release-kit
      - name: F6.3 certify independent documentary identity review boundary on Windows
        shell: pwsh
        run: python tools/verify_f6_3_documentary_boundary.py --kit-dir dist/release-kit
      - name: F6.4 certify synthetic custody on Windows
        shell: pwsh
        run: python tools/verify_f6_4_custody_portability.py --kit-dir dist/release-kit
      - name: F6.5–F6.10 certify onboarding through retry safety on Windows
        shell: pwsh
        run: python tools/verify_f6_5_provider_onboarding.py --kit-dir dist/release-kit
      - name: Upload Windows-specific certified ZIP
        uses: actions/upload-artifact@v4
        with:
          name: EIOS-F6-1-Windows-Onboarding-Kit-Python312
          path: dist/release-kit/EIOS_F5_10_Neutral_Onboarding_Kit.zip
          if-no-files-found: error
          retention-days: 14
