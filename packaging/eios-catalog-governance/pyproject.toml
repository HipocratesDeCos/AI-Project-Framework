[build-system]
requires = ["setuptools>=64", "wheel>=0.42"]
build-backend = "setuptools.build_meta"

[project]
name = "eios-catalog-governance"
version = "0.1.0"
description = "Optional durable, externally authorized capability catalog configuration for EIOS"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.0,<3.0",
  "eios-kernel==0.1.0",
  "eios-input-contracts==0.1.0",
  "eios-capability-catalog==0.1.0",
]

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]
include = ["eios", "eios.catalog_governance"]
namespaces = true
