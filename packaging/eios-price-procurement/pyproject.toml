[build-system]
requires = ["setuptools>=64", "wheel>=0.42"]
build-backend = "setuptools.build_meta"

[project]
name = "eios-price-procurement"
version = "0.1.0"
description = "Optional EIOS procurement PRICE C1 intelligence and documentary gates"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.0,<3.0"]

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]
include = ["eios", "eios.core", "eios.pricing"]
namespaces = true
