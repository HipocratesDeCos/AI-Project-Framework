[build-system]
requires = ["setuptools>=64", "wheel>=0.42"]
build-backend = "setuptools.build_meta"

[project]
name = "eios-tco-procurement"
version = "0.2.0"
description = "Optional EIOS procurement TCO calculation from canonical purchase contracts"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.0,<3.0", "eios-contracts-procurement==0.1.0"]

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]
include = ["eios", "eios.core", "eios.tco"]
namespaces = true
