[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "eios-mvp"
version = "0.1.0"
description = "EIOS procurement decision-support MVP"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0,<3.0",
    "openpyxl>=3.1,<4.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0,<9.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["."]
include = ["eios", "eios.*"]
namespaces = true
