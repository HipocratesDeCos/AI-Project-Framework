[build-system]
requires = ["setuptools>=64", "wheel>=0.42"]
build-backend = "setuptools.build_meta"

[project]
name = "eios-company-adapter-example"
version = "0.1.0"
description = "External synthetic per-company input adapter for the neutral EIOS engine"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.0,<3.0",
  "eios-kernel==0.1.0",
  "eios-input-contracts==0.1.0",
  "eios-capability-catalog==0.1.0",
  "eios-catalog-governance==0.1.0",
]

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]
include = ["eios_company_adapter_example"]
